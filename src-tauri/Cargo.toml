[package]
name = "display-layout-manager"
version = "0.1.0"
description = "A macOS MVP for visual display layout management"
authors = ["Display Layout Manager"]
edition = "2021"

[lib]
name = "display_layout_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
core-foundation = "0.9"
core-graphics = "0.23"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
